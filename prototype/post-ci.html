          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

            <rect x="10" y="10" width="80" height="80" rx="2" fill="none" stroke="var(--seal-color)" stroke-width="0.6" opacity="0.5"/>

              <text x="65" y="66">唇</text>

            </g>
          </svg>

        </ul>
      </nav>
    </div>

  <main class="site-main site-main--narrow">
    <article class="post-ci">

      <!-- 头部：词牌名与元数据 -->
      <header class="post-ci__header">
        <span class="post-category-tag">词卷</span>

        <!-- @hexo: if page.cipai -->
        <span class="post-ci__cipai-badge">词牌 · 水调歌头</span>
        <!-- @end -->

        <!-- @hexo: page.title -->
        <h1 class="post-title enter">水调歌头·秋夜怀远</h1>
        <!-- @end -->

        <div class="post-card__meta" style="justify-content: center; margin-top: var(--space-2);">
          <!-- @hexo: date(page.date, 'YYYY-MM-DD') -->
          <time datetime="2026-10-10">2026-10-10</time>
          <!-- @end -->
          <span class="meta-separator">·</span>
          <!-- @hexo: page.rhyme -->
          <span>词林正韵第七部（仄韵）</span>
          <!-- @end -->
        </div>
      </header>

      <!-- 词作正文（居中横排，韵脚朱砂圆点） -->
      <!-- @hexo: page.content -->
      <div class="post-ci__body-horizontal">
        <p class="post-ci__line">
          露下碧梧冷，风引画檐<span class="rhyme-dot" title="韵脚：铃">铃</span>。
        </p>
        <p class="post-ci__line">
          素娥何事多病，掩泪对孤<span class="rhyme-dot" title="韵脚：屏">屏</span>。
        </p>
        <p class="post-ci__line">
          料得玉阶凝伫，应念青衫零落，清梦绕江<span class="rhyme-dot" title="韵脚：南">南</span>。
        </p>
        <p class="post-ci__line">
          回首故山路，极目暮云<span class="rhyme-dot" title="韵脚：平">平</span>。
        </p>
        <!-- 下阕起句：上下阕之间只以留白承接过片，不设标记 -->
        <p class="post-ci__line post-ci__line--lower-stanza">
          溯流光，吹铁笛，醉中<span class="rhyme-dot" title="韵脚：听">听</span>。
        </p>
        <p class="post-ci__line">
          十年旧约何在？客舍冷青<span class="rhyme-dot" title="韵脚：灯">灯</span>。
        </p>
        <p class="post-ci__line">
          但使冰心依旧，休问流年虚度，天际看孤<span class="rhyme-dot" title="韵脚：星">星</span>。
        </p>
        <p class="post-ci__line">
          待得梅花发，再共拂尘缨<span class="rhyme-dot" title="韵脚：缨"></span>。
        </p>
      </div>
      <!-- @end -->

      <!-- 文章末尾落款：题跋在上，朱印钤于年号左下 -->
      <div class="post-signature post-signature--ci">
        <div class="post-signature__meta">
          <p class="post-signature__author">春唇语冬 记</p>
          <time datetime="2026-10-10">丙午秋月 霜降前夕</time>
          <!-- 沉静入口：极细羽笔 + 雅致小字，点之成笺 -->
          <span class="share-trigger" role="button" tabindex="0" data-poem-slip-open aria-label="题笺：将本词裁为竖排诗笺">
            <svg class="feather-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M19.6 4.4c-6.4 0-11 4.1-12.5 9.1L4.6 19.8"/>
              <path d="M19.6 4.4c.1 5-2.4 8.6-5.9 10.7"/>
              <path d="M8.2 14.1l1.6-4.2"/>
              <path d="M11.3 11.9l1.5-4"/>
            </svg>题笺</span>
        </div>
        <div class="seal seal--signature" aria-label="春唇语冬钤印">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="春唇语冬印">
            <rect x="6" y="6" width="88" height="88" rx="3" fill="none" stroke="var(--seal-color)" stroke-width="1.5"/>
            <rect x="10" y="10" width="80" height="80" rx="2" fill="none" stroke="var(--seal-color)" stroke-width="0.6" opacity="0.5"/>
            <g fill="var(--seal-color)" font-family="var(--font-seal)" font-size="28" font-weight="bold" text-anchor="middle" dominant-baseline="central">
              <text x="65" y="34">春</text>
              <text x="65" y="66">唇</text>
              <text x="35" y="34">语</text>
              <text x="35" y="66">冬</text>
            </g>
          </svg>
        </div>
      </div>

    </article>

  <footer class="site-footer">

        <span class="seal seal--mini" aria-hidden="true">

            <rect x="6" y="6" width="88" height="88" rx="3" fill="none" stroke="var(--seal-color)" stroke-width="1.5"/>

  <!-- 题笺分享浮层（诗笺预览）：深墨遮罩之上，右起竖排素笺 -->

    <div class="poem-slip__stack" role="dialog" aria-modal="true" aria-label="题笺预览">
      <div class="poem-slip">
        <div class="poem-slip__cols" data-poem-slip-cols></div>
        <span class="poem-slip__watermark">松烟</span>
      </div>
      <div class="poem-slip__actions">
        <button type="button" class="poem-slip-action poem-slip-action--save" data-poem-slip-save>[ 存为诗笺 ]</button>
        <button type="button" class="poem-slip-action" data-poem-slip-close>[ 阖卷 ]</button>
      </div>
      <p class="poem-slip__status" data-poem-slip-status aria-live="polite"></p>
    </div>
