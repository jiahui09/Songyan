# =========================================================
# 松烟 (Songyan) 主题核心配置 v0.1
# 设计哲学：外古内今，分卷而治
# 词重仪式，技术重效率
# =========================================================

theme_name: "松烟"

# 作者信息（印文/尺寸/刻法统一走下方 seal 块）
author:
  name: "春唇语冬"
  homepage: "https://example.com"

# 色彩模式（硬性锁定：宣纸暖调浅色主题，不做暗色模式）
color_scheme: "light"

# =========================================================
# 纯矢量金石印章生成器 (Crisp Vector Seal Generator)
# 构建期输出 SVG：印文经 lib/ 字库逐字转篆书轮廓内联，蒙版剪切崩刃/飞白/砂眼，无滤镜无栅格化
# =========================================================
seal:
  enable: true               # 是否开启印章模块
  text: "春唇语冬"           # 默认印章文字（2~4 字；4 字按古法直读：右上→右下→左上→左下）
  style: "yang"              # 默认刻法：yang（朱文/阳刻，细线红字）| yin（白文/阴刻，红底白字）| mixed（朱白相间，逐格相间）
  size: 34                   # 默认尺寸 (px)
  rotate: -1.2               # 微倾斜角度 (deg)，模拟手盖印泥的自然微偏
  density: 1.0               # 刀痕崩刃、金石飞白与砂眼颗粒密度 (0.5 ~ 1.5)
  seed: 42                   # 随机种子（固定种子确保重建时刀痕完全一致）
  alias: true                # 缺字时按 lib/seal-alias.json 回填篆法正字/繁体（1316 条，
                             #   取自「篆印 Zhuanyin」ALIAS 表，Apache-2.0）；false 则缺字直接走楷体回退链
  shape: "square"            # 形制：square（方印，默认）| round（圆印）| oblong（长方闲章）
  order: "zhi"               # 四字章序：zhi（直读：右上→右下→左上→左下）| hui（回文：右上→左上→左下→右下）
  ink: "cinnabar"            # 印泥色阶：cinnabar（鲜朱，默认）| zhubiao（朱磦）| shenha（深赭）

  # 位置控制（未移植版式留待各自模板接入）
  locations:
    navbar: true             # 导航栏站名处落印
    post_header: false       # 文章题头是否落分类名印
    post_footer: false       # 文章文末落款处加盖作者印章（post.ejs 移植时接入）
    sidebar: false           # 侧边栏/名片区（暂无该版式）


# 设计令牌与色彩系统映射（镜像 source/css/tokens.css，唯一实现以 tokens.css 为准）
style:
  paper_bg:      "#F7F2E7"  # 主宣纸底色
  paper_subtle:  "#EFEAE0"  # 浅灰茶色（代码块/暗调引用块）
  ink_primary:   "#2B2B2B"  # 浓松烟墨，主正文（对比度 ≥ 7:1）
  ink_secondary: "#666055"  # 淡松烟墨，元数据与说明文字
  cinnabar_red:  "#A8332A"  # 朱砂，分类题头与章印（对比度 ≥ 4.5:1）
  bamboo_border: "#E2D9C8"  # 淡竹纸缝线/界线
  bamboo:        "#6B7F5E"  # 竹青标签、维护中状态
  ochre:         "#B08D57"  # 赭石细线、归档节点

# 字体策略（系统字体优先，首版严禁 @import 外部 WebFont）
font:
  use_cdn: false
  title_font: "LXGW WenKai"
  body_font:  "Noto Serif SC"
  code_font:  "Fira Code"

# 文章类型路径映射规则（由 scripts/type-mapping.js 处理；两轨制 ci / post）
type_mapping:
  "ci/**":       "ci"

# 词卷配置 (type: ci)
ci:
  vertical_desktop: true   # 桌面端 (≥1024px 且支持 hover) 启用竖排，移动触控设备自动降级横排
  show_annotation: true    # 启用难词笺注悬停 1.5s 淡入联动
  show_rhyme: true         # 启用韵脚 2px 朱砂圆点标记

# 卷首首页配置
home:
  stream_limit: 9          # 首页归流单列文章流展示条数（诗文双轨）
  featured: false          # 精选置顶推荐（规划于 v0.2 启用）
  hero_verse: "一研松烟分细墨 · 四卷清赏寄余年"   # 卷首词句
  hero_tagline: "外古内今 · 分卷而治"             # 卷首副题
  sections:                                 # 词卷栏目头（文章页统一走 labels.post 回退）
    ci:
      menu: 词卷        # 首页元信息分类名回退文案
      index: 一         # 入口序号（四卷四色）
      desc: 旧调新填，韵脚笺注
      tag: 最新词选
      more: 查看全卷 →
      limit: 3

# 卡片元数据标签（禁止在模板中硬编码文本）
labels:
  cipai: 词牌
  post: 文稿            # 无分类文章的元信息/题头回退文案
  weather: 气候
  mood: 心境
  detail: 详情 →
  back_to_home: 返回卷首

# 页脚
footer:
  links:
    归档时间线: /archives/
    关于斋主: /about/
    空笺样例: /404.html
  copyright: "© 2026 春唇语冬 · 纯粹原笔 · 守此一砚松烟"
  note: "基于 Hexo 主题「松烟」构建 · 宣纸暖色 · 系统字体"

# 导航菜单
menu:
  首页: /
  归档: /archives/
  关于: /about/
