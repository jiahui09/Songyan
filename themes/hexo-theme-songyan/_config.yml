# =========================================================
# 松烟 (Songyan) 主题核心配置 v1.0
# 设计哲学：外古内今，分卷而治
# 词重仪式，技术重效率
# =========================================================

theme_name: "松烟"

# 作者信息（印文/尺寸/刻法统一走下方 seal 块）
author:
  name: "春唇语冬"

# =========================================================
# 纯矢量金石印章生成器 (Crisp Vector Seal Generator)
# 构建期输出 SVG：印文经 lib/ 字库逐字转篆书轮廓内联，蒙版剪切崩刃/飞白/砂眼，无滤镜无栅格化
# =========================================================
seal:
  enable: true               # 是否开启印章模块
  text: "春唇语冬"           # 默认印章文字（2~4 字；4 字按古法直读：右上→右下→左上→左下）
  style: "yang"              # 默认刻法：yang（朱文/阳刻，细线红字）| yin（白文/阴刻，红底白字）| mixed（朱白相间，逐格相间）
  size: 36                   # 页头印章尺寸 (px)，保留印文辨识度；文末落款独立设置
  navbar_image: "/images/stamp-1794661989454.png" # 仅替换站名旁印章；留空则使用矢量生成器
  rotate: -1.2               # 微倾斜角度 (deg)，模拟手盖印泥的自然微偏
  density: 1.0               # 刀痕崩刃、金石飞白与砂眼颗粒密度 (0.5 ~ 1.5)
  seed: 42                   # 随机种子（固定种子确保重建时刀痕完全一致）
  alias: true                # 缺字时按 lib/seal-alias.json 回填篆法正字/繁体（1316 条，
                             #   取自「篆印 Zhuanyin」ALIAS 表，Apache-2.0）；false 则缺字直接走楷体回退链
  shape: "square"            # 形制：square（方印，默认）| round（圆印）| oblong（长方闲章）
  order: "zhi"               # 四字章序：zhi（直读：右上→右下→左上→左下）| hui（回文：右上→左上→左下→右下）
  ink: "cinnabar"            # 印泥色阶：cinnabar（鲜朱，默认）| zhubiao（朱磦）| shenha（深赭）

  # 位置控制
  locations:
    navbar: true             # 导航栏站名处落印
    post_footer: true        # 文章文末落款处加盖作者印章


# 文章类型路径映射规则（由 scripts/type-mapping.js 处理；两轨制 ci / post）
type_mapping:
  "ci/**":       "ci"

# 词卷配置 (type: ci)
ci:
  vertical_desktop: true   # 桌面默认竖排；作者在 Front Matter 用 poetry_layout: horizontal | vertical 覆盖；窄屏横排
  share: true

# 卷首首页配置
home:
  cover: true                                    # 首页卷首题签上移停靠后随正文离开；页眉收拢并固定在顶部；false 则直接归流
  hero_verse: "一研松烟分细墨 · 四卷清赏寄余年"   # 卷首词句
  hero_source: 春唇语冬 · 卷首自题

# 界面文案（禁止在模板中硬编码文本）
labels:
  skip_content: 跳至正文
  year: 年
  month: 月
  day: 日
  pagination: 分页
  code_copy: 复制代码
  code_copied: 已复制
  code_failed: 请选中代码复制
  code_expand: 展开代码
  code_collapse: 收起代码
  poem_open: 题笺
  poem_preview: 题笺预览
  poem_save: 存为诗笺
  poem_close: 阖卷
  poem_overflow: 此词超出单张诗笺容量，请在预览中滚动阅读；为避免截字，暂不导出。
  margin_notes: 旁批
  quiet_reading: 静读
  tags: 系
  weather: 天候
  mood: 心境
  empty: 此卷暂无篇什
  previous: 上一页
  next: 下一页
  post: 文稿            # 无分类文章的元信息/题头回退文案
  location: 驻足        # 详情页元信息「驻足」槽位前缀（front-matter location 缺省即隐藏）
  back_to_home: 返回卷首
  comments: 笔谈

# 评论（Gitalk）：默认关闭；填入 GitHub OAuth 与仓库信息后开启
comments:
  enable: true
  gitalk:
    enable: false
    clientID:
    clientSecret:
    repo:
    owner:
    admin: []
    distractionFreeMode: false
    language: zh-CN
    perPage: 10
    pagerDirection: last
    legacy_path_ids: {}       # 迁移站点可填「URL 路径: 原评论 ID」，保留已有 Gitalk 关联
    createIssueManually: false

# 页脚
footer:
  copyright: "© 二〇二六 春唇语冬"
  note: "落花人独立，微雨燕双飞 · Hexo 主题「松烟」"

# 导航菜单
menu:
  首页: /
  归档: /archives/
  关于: /about/

archive:
  title: 岁时笺纸 · 历年归档
  count_prefix: 当前篇什
  count_suffix: 篇
  filter_label: 按分卷筛选
  list_label: 目录
  recent: 3                         # 首屏近期篇目数；下滑后隐去，进入完整时间轴
  recent_label: 近期篇什
  categories:
    ci: 词卷
    essay: 随笔
    tech: 技术
    project: 项目
  category_names:
    ci: [词卷, 诗词]
    essay: [随笔, 杂记]
    tech: [技术, 前端工程]
    project: [项目, 开源项目]
  fallback_category: essay          # 未命中分类映射时的兜底分卷键
  solar_terms:                      # 月签节气：按公历月归属（每月的两个节气）
    1: [小寒, 大寒]
    2: [立春, 雨水]
    3: [惊蛰, 春分]
    4: [清明, 谷雨]
    5: [立夏, 小满]
    6: [芒种, 夏至]
    7: [小暑, 大暑]
    8: [立秋, 处暑]
    9: [白露, 秋分]
    10: [寒露, 霜降]
    11: [立冬, 小雪]
    12: [大雪, 冬至]

about:
  title: 关于
  tagline: 守一砚松烟 · 诗文同卷
  introduction: 此处记录诗词、随笔与工程札记。诗词保留句读与分阕，文章以清晰、安静的阅读为先。
  heading: 关于松烟
  description: 古意留于纸色、字体与留白，技术与项目保持现代阅读效率。

not_found:
  title: 一纸空笺
  lines: [此处无字。, 或已被收进别的卷里。]
  home: 回卷首
  archive: 去归档
