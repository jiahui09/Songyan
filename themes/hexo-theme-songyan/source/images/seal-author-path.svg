<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="春唇语冬印（路径版）">
  <defs>
    <filter id="seal-path-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- 外线 1.5px，圆角 3px -->
  <rect x="6" y="6" width="88" height="88" rx="3"
        fill="none" stroke="var(--seal-color, #B03A2E)" stroke-width="1.5"/>
  <!-- 内线 0.6px，透明度 0.5，圆角 2px -->
  <rect x="10" y="10" width="80" height="80" rx="2"
        fill="none" stroke="var(--seal-color, #B03A2E)" stroke-width="0.6" opacity="0.5"/>

  <!-- 篆意笔画路径：右上「春」、右下「唇」、左上「语」、左下「冬」 -->
  <g fill="none" stroke="var(--seal-color, #B03A2E)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 右上：春 (x: 52..78, y: 18..46) -->
    <path d="M54 22 h22 M55 27 h20 M53 32 h24" />
    <path d="M65 18 c-3 7 -8 13 -13 16" />
    <path d="M66 28 c3 4 8 8 13 10" />
    <!-- 日部 -->
    <path d="M59 36 v9 h12 v-9 z M59 40.5 h12" />

    <!-- 右下：唇 (x: 52..78, y: 53..82) -->
    <!-- 辰部 -->
    <path d="M54 55 h22 M55 60 h18 M58 55 v14 M58 63 c4 0 10 -1 14 0" />
    <path d="M54 62 c1 7 -1 12 -2 15" />
    <!-- 口部 -->
    <path d="M58 70 v9 h14 v-9 z" />

    <!-- 左上：语 (x: 22..48, y: 18..46) -->
    <!-- 言部 -->
    <path d="M28 20 h1 M25 24 h7 M26 27 h5 M26 30 h5" />
    <path d="M26 33 v6 h6 v-6 z" />
    <!-- 吾部：五+口 -->
    <path d="M36 21 h11 M42 21 v7 M38 25 h8 M36 28 h11" />
    <path d="M38 34 v8 h9 v-8 z" />

    <!-- 左下：冬 (x: 22..48, y: 53..82) -->
    <!-- 夂部 -->
    <path d="M31 55 c4 0 7 2 7 5 c0 4 -7 8 -13 10" />
    <path d="M30 62 c4 3 9 7 15 11" />
    <!-- 两点冰部 -->
    <circle cx="30" cy="74" r="1.5" fill="var(--seal-color, #B03A2E)" stroke="none" />
    <circle cx="34" cy="79" r="1.5" fill="var(--seal-color, #B03A2E)" stroke="none" />
  </g>

  <!-- 手工钤盖肌理蒙版 -->
  <rect x="6" y="6" width="88" height="88" rx="3"
        fill="var(--seal-color, #B03A2E)" filter="url(#seal-path-texture)"
        opacity="0.5" style="mix-blend-mode: multiply" pointer-events="none"/>
</svg>
