<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="../prototype/page-about.html" style="width:1440px;height:600px"></iframe>
<pre id="out">pending</pre>
<script>
document.getElementById('f').addEventListener('load', () => {
  const d = document.getElementById('f').contentDocument;
  const m = d.querySelector('main');
  const cs = getComputedStyle(m);
  const r = m.getBoundingClientRect();
  const link = d.querySelector('link[href*="layouts"]').href;
  document.getElementById('out').textContent = JSON.stringify({
    mainClass: m.className,
    rect: {x: r.x, w: r.width},
    maxW: cs.maxWidth, padL: cs.paddingLeft, disp: cs.display,
    layoutsHref: link
  });
});
</script></body></html>
